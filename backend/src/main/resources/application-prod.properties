spring.application.name=flip7

# PostgreSQL - values injected by docker-compose at runtime
# Using :? syntax so the app refuses to start if a variable is missing
spring.datasource.url=${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris
# update: applies only additive schema changes (safe for existing data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port
server.port=3200
server.address=0.0.0.0

jwt.secret=${JWT_SECRET:?JWT_SECRET is required}

myApp.BearerHeader=Bearer
