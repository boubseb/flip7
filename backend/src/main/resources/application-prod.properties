spring.application.name=flip7

# PostgreSQL - values overridden by Docker env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/flip7}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flip7_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Testflip7!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port
server.port=3200
server.address=0.0.0.0

jwt.secret=${JWT_SECRET:change-me_change-me_change-me_change-me_change-me}

myApp.BearerHeader=Bearer 
