services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flip7
      POSTGRES_USER: flip7_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Testflip7!}
    volumes:
      - /storage/flip7/postgres:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flip7_admin -d flip7"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flip7
      SPRING_DATASOURCE_USERNAME: flip7_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Testflip7!}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-change-me_change-me_change-me_change-me_change-me}
    networks:
      - web

  # ── Angular SSR Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
      NODE_ENV: production
    networks:
      - web

networks:
  web:
    external: true
