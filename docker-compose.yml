services:
  db:
    image: postgres:16-alpine
    container_name: flip7_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /storage/flip7/postgres:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: /storage/flip7/backend
      dockerfile: Dockerfile
    container_name: flip7_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - app_internal
      - web
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3200' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

  frontend:
    build:
      context: /storage/flip7/frontend
      dockerfile: Dockerfile
    container_name: flip7_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4000' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  app_internal:
    internal: true
  web:
    external: true
