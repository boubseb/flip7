<div class="app-shell">
  <header class="app-header">
    <h1>Flip7</h1>
    <p>Jeu de société - mobile first</p>
  </header>

  <main>
    <section class="home-card">
      <button id="localBtn">Jouer en local</button>
      <button id="networkBtn">Créer / Rejoindre une partie réseau</button>
    </section>

    <section class="auth-card">
      <h3>Connexion</h3>
      <form id="loginForm">
        <input placeholder="Nom d'utilisateur" name="username" />
        <input placeholder="Mot de passe" name="password" type="password" />
        <button type="submit">Se connecter</button>
      </form>
      <p>ou</p>
      <form id="registerForm">
        <input placeholder="Nom d'utilisateur" name="username" />
        <input placeholder="Mot de passe" name="password" type="password" />
        <button type="submit">S'inscrire</button>
      </form>
    </section>

  </main>
</div>
