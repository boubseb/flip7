<div class="player-hand">
  <div class="cards-container">
    @for (card of cards; track card) {
      <app-card
        [card]="card"
        [selectable]="selectable"
        [selected]="isSelected(card)"
        (cardClick)="onCardClick(card)">
      </app-card>
    }
  </div>
  
  @if (cards.length > 0) {
    <div class="hand-info">
      {{ cards.length }} {{ cards.length > 1 ? ('game.cardCountPlural' | translate) : ('game.cardCountSingular' | translate) }}
    </div>
  }
</div>
