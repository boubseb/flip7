<header class="header">
  <div class="header-container">
    <button class="rules-button" (click)="toggleIsRules()">
      <span class="info-icon">i</span>
    </button>
    <div class="title-container">
      <h1 class="title" routerLink="/" (click)="onTitleClick($event)">Flip 7</h1>
    </div>
    
    <!-- Boutons Thème et Langue -->
    <div class="header-controls">
      <button class="control-button theme-toggle" (click)="toggleTheme()" [title]="'Toggle theme'">
        @if((currentTheme$ | async) === 'light') {
          <span class="icon">🌙</span>
        } @else {
          <span class="icon">☀️</span>
        }
      </button>
      
      <button class="control-button language-toggle" (click)="toggleLanguage()" [title]="'Change language'">
        <span class="language-text">{{ (currentLanguage$ | async) === 'fr' ? 'EN' : 'FR' }}</span>
      </button>
    </div>
    
    <div class="profil-container">
      @if((isLogin$| async) ===true){ 
        <div class="profil-menu-wrapper">
          <div class="profil-image" (click)="toggleProfilMenu()">
            <img class="avatar" src="assets/pictures/Connexion.png" alt="profil">
          </div>
          @if(isProfilMenuOpen) {
            <div class="dropdown-menu">
              <button class="menu-item" (click)="openProfil()">
                <span class="menu-icon">👤</span>
                <span>{{ 'header.profile' | translate }}</span>
              </button>
              <button class="menu-item" (click)="openStats()">
                <span class="menu-icon">📊</span>
                <span>{{ 'profile.stats' | translate }}</span>
              </button>
              <button class="menu-item logout" (click)="onLogout()">
                <span class="menu-icon">🚪</span>
                <span>{{ 'header.logout' | translate }}</span>
              </button>
            </div>
          }
        </div>
      }
    </div>
  </div>
</header>

@if(isRules){
<div class="rules-container">
  <app-rules></app-rules>
</div>
}
@if(isProfil){
<div class="profil-page-container">
  <app-profil></app-profil>
</div>
}
@if(isStatistics){
<div class="statistics-container">
  <app-statistics></app-statistics>
</div>
}
