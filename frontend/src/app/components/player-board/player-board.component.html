<div class="player-board">
  <!-- Cartes révélées (max 33% hauteur) -->
  <div class="revealed-cards-section">
    <h3 class="section-title">Mes cartes révélées</h3>
    <div class="revealed-cards-grid">
      <div class="card revealed" *ngFor="let card of getMyRevealedCards()">
        <span class="card-suit">{{ getCardSuit(card) }}</span>
        <span class="card-value">{{ getCardValue(card) }}</span>
      </div>
      <div class="no-cards" *ngIf="getMyRevealedCards().length === 0">
        <p>Aucune carte révélée</p>
      </div>
    </div>
  </div>

  <!-- Zone de jeu (67% hauteur restante) -->
  <div class="game-section">
    <div class="game-info" *ngIf="gameState">
      <div class="info-item">
        <span class="label">Round</span>
        <span class="value">{{ gameState.currentRound || 1 }} / {{ gameState.totalRounds || 5 }}</span>
      </div>
      <div class="info-item">
        <span class="label">Phase</span>
        <span class="value">{{ gameState.currentPhase || 'EN_ATTENTE' }}</span>
      </div>
      <div class="info-item" *ngIf="isMyTurn">
        <span class="turn-indicator">🎯 Votre tour</span>
      </div>
    </div>

    <div class="center-area" *ngIf="gameState && gameState.centerCards">
      <h3>Cartes au centre</h3>
      <div class="center-cards">
        <div class="card" *ngFor="let card of gameState.centerCards">
          <span class="card-suit">{{ getCardSuit(card) }}</span>
          <span class="card-value">{{ getCardValue(card) }}</span>
        </div>
      </div>
    </div>

    <div class="hand-area">
      <div class="current-card-container">
        <div class="card-wrapper" [class.flipping]="isFlipping">
          <!-- Face cachée (dos de carte avec image) -->
          <div class="card card-back" [class.hidden]="cardRevealed">
            <img src="assets/cards/backside.png" alt="Dos de carte" class="card-back-image">
          </div>
          <!-- Face visible -->
          <div class="card card-front" [class.visible]="cardRevealed">
            <img src="assets/cards/backside.png" alt="Carte révélée" class="card-back-image">
          </div>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-continue" (click)="continueRevealing()" [disabled]="isFlipping">
        <span class="icon">🎴</span>
        <span>Hit</span>
      </button>
      <button class="btn btn-stop" (click)="stopRevealing()" [disabled]="isFlipping">
        <span class="icon">✋</span>
        <span>Stop</span>
      </button>
    </div>
  </div>
</div>
