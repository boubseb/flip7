<div 
  class="card" 
  [class.selectable]="selectable"
  [class.selected]="selected"
  [style.background]="getCardColor()"
  (click)="onCardClick()">
  
  <div class="card-content">
    <div class="card-icon" *ngIf="getCardIcon()">
      {{ getCardIcon() }}
    </div>
    <div class="card-value">
      {{ card.displayName }}
    </div>
  </div>
</div>
