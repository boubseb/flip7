<div class="players-board">
  <div class="players-grid" *ngIf="players.length > 0">
    <div 
      class="player-card" 
      *ngFor="let playerId of players; let i = index"
      [class.current-player]="playerId === currentPlayerId"
      [class.current-user]="playerId === currentUserId">
      
      <div class="player-header">
        <div class="player-info">
          <span class="player-number">#{{ i + 1 }}</span>
          <span class="player-name">
            {{ playerId === currentUserId ? 'Vous' : getPlayerPseudo(playerId) }}
          </span>
        </div>
        <div class="player-badges">
          <span class="badge-turn" *ngIf="playerId === currentPlayerId">🎯 Son tour</span>
          <span class="badge-you" *ngIf="playerId === currentUserId">Vous</span>
        </div>
      </div>

      <div class="player-content">
        <div class="player-hand">
          <div class="hand-label">{{ getPlayerHandCount(playerId) }} cartes</div>
          <div class="cards-preview">
            <div class="card-back" *ngFor="let card of getPlayerCards(playerId)">
              🂠
            </div>
          </div>
        </div>

        <div class="player-stats" *ngIf="gameState">
          <div class="stat-item">
            <span class="stat-label">Score</span>
            <span class="stat-value">{{ getPlayerScore(playerId) }}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Plis</span>
            <span class="stat-value">{{ getPlayerTricks(playerId) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="no-players" *ngIf="players.length === 0">
    <p>Aucun joueur dans la partie</p>
  </div>
</div>
