<div class="game-page-container">
  <!-- Error message -->
  <div class="error-banner" *ngIf="errorMessage">
    <span>{{ errorMessage }}</span>
    <button (click)="clearError()">✕</button>
  </div>

  <!-- GAME VIEW -->
  <div class="game-view" *ngIf="currentRoom">
    <div class="game-header">
      <button class="btn-leave" (click)="leaveRoom()">✕</button>
    </div>

    <!-- Game Content Area -->
    <div class="game-content">
      <!-- Players Board View (All players) -->
      <app-players-board 
        *ngIf="gameViewMode === 'all'"
        [gameState]="currentRoom.gameState"
        [players]="currentRoom.players"
        [playerInfos]="currentRoom.playerInfos || []"
        [currentUserId]="currentUserId"
        [currentPlayerId]="currentRoom.currentPlayerId">
      </app-players-board>

      <!-- Player Board View (Current player) -->
      <app-player-board 
        *ngIf="gameViewMode === 'player'"
        [gameState]="currentRoom.gameState"
        [currentUserId]="currentUserId"
        [isMyTurn]="isMyTurn"
        (onPlayCard)="playTurn($event)">
      </app-player-board>

      <!-- Score Board View -->
      <app-score-board 
        *ngIf="gameViewMode === 'score'"
        [gameState]="currentRoom.gameState"
        [players]="currentRoom.players"
        [playerInfos]="currentRoom.playerInfos || []">
      </app-score-board>
    </div>

    <!-- Bottom Navigation Menu -->
    <div class="game-nav-menu">
      <button 
        class="nav-btn"
        [class.active]="gameViewMode === 'all'"
        (click)="switchGameView('all')">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Tous</span>
      </button>
      <button 
        class="nav-btn"
        [class.active]="gameViewMode === 'player'"
        (click)="switchGameView('player')">
        <span class="nav-icon">🃏</span>
        <span class="nav-label">Ma main</span>
      </button>
      <button 
        class="nav-btn"
        [class.active]="gameViewMode === 'score'"
        (click)="switchGameView('score')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Scores</span>
      </button>
    </div>
  </div>
</div>
