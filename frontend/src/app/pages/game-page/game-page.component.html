<div class="game-page-container">
  <!-- Error message -->
  @if (errorMessage) {
    <div class="error-banner">
      <span>{{ errorMessage }}</span>
      <button (click)="clearError()">✕</button>
    </div>
  }

  <!-- Success message -->
  @if (successMessage) {
    <div class="success-banner">
      <span>{{ successMessage }}</span>
      <button (click)="clearSuccess()">✕</button>
    </div>
  }

  <!-- GAME VIEW -->
  @if (currentRoom) {
    <div class="game-view">
      <!-- Game Content Area -->
      <div class="game-content">
        <!-- Players Board View (All players) -->
        @if (gameViewMode === 'all') {
          <app-players-board 
            [gameState]="gameState"
            [players]="currentRoom.players"
            [playerInfos]="currentRoom.playerInfos || []"
            [currentUserId]="currentUserId"
            [currentPlayerId]="currentPlayerId">
          </app-players-board>
        }

        <!-- Player Board View (Current player) -->
        @if (gameViewMode === 'player') {
          <app-player-board 
            [gameState]="gameState"
            [currentUserId]="currentUserId"
            [isMyTurn]="isMyTurn"
            (onPlayCard)="onPlayerAction($event)">
          </app-player-board>
        }

        <!-- Score Board View -->
        @if (gameViewMode === 'score') {
          <app-score-board 
            [gameState]="gameState"
            [players]="currentRoom.players"
            [playerInfos]="currentRoom.playerInfos || []">
          </app-score-board>
        }
      </div>

    </div>
  }
</div>

<!-- Footer with game navigation -->
<app-footer 
  [gameViewMode]="gameViewMode" 
  (onSwitchView)="switchGameView($event)">
</app-footer>

<!-- Player Selector Modal - Stop Card -->
<app-player-selector
  [show]="showStopCardModal"
  [title]="'🛑 Carte Stop'"
  [description]="'Choisissez le joueur qui recevra la carte Stop et sera forcé de s\'arrêter :'"
  [players]="gameState?.players || []"
  [currentUserId]="currentUserId"
  [cardType]="'STOP'"
  (onPlayerSelected)="assignStopToPlayer($event)"
  (onCancel)="closeStopCardModal()">
</app-player-selector>

<!-- Player Selector Modal - DrawThree Card -->
<app-player-selector
  [show]="showDrawThreeModal"
  [title]="'➕3️⃣ Carte +3'"
  [description]="'Choisissez le joueur qui recevra la carte +3 et devra piocher 3 cartes :'"
  [players]="gameState?.players || []"
  [currentUserId]="currentUserId"
  [cardType]="'DRAW_THREE'"
  (onPlayerSelected)="assignDrawThreeToPlayer($event)"
  (onCancel)="closeDrawThreeModal()">
</app-player-selector>

<!-- Start Round Popup -->
<app-start-round-popup
  [show]="showStartRoundPopup"
  [roundNumber]="gameState?.roundNumber || 1"
  [playerUsername]="getCurrentPlayerUsername()"
  [isCurrentPlayer]="isMyTurn"
  (onStartRound)="startRound()">
</app-start-round-popup>
