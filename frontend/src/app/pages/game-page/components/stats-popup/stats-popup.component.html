<div class="stats-popup-overlay" (click)="close.emit()">
  <div class="stats-popup-content" (click)="$event.stopPropagation()">
    <h3>{{ 'game.statsPopup.title' | translate }}</h3>
    <div class="stats-probability-value">
      {{ probability !== null ? formatProbability(probability) + ' %' : ('game.statsPopup.na' | translate) }}
    </div>
    <div class="stats-probability-desc">{{ 'game.statsPopup.desc' | translate }}</div>
    <button class="btn btn-close" (click)="close.emit()">{{ 'game.statsPopup.close' | translate }}</button>
  </div>
</div>
