<div class="register-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <h1>{{ 'register.title' | translate }}</h1>

        <label for="name">{{ 'register.username' | translate }} *</label>
        <input id="name" formControlName="name" type="text" required [title]="'register.username' | translate">

        <label for="lastName">Prénom *</label>
        <input id="lastName" formControlName="lastName" type="text" required title="Veuillez entrer votre prénom.">

        <label for="birthDate">Date de naissance *</label>
        <input id="birthDate" formControlName="birthDate" type="date" required
            title="Veuillez entrer votre date de naissance.">

        <label for="pseudo">Pseudo *</label>
        <input id="pseudo" formControlName="pseudo" type="text" required title="Veuillez entrer votre pseudo.">

        <label for="Mail">{{ 'register.email' | translate }} *</label>
        <input id="Mail" formControlName="mailAddress" type="email" required
            [title]="'register.email' | translate">

        <label for="password">{{ 'register.password' | translate }} * (8 caractères min, num, maj, spé)</label>
        <input id="password" formControlName="password" type="password" required
            [title]="'register.password' | translate">

        <label for="confirmationPassword">{{ 'register.confirmPassword' | translate }} *</label>
        <input id="confirmationPassword" formControlName="passwordConfirmation" type="password" required
            [title]="'register.confirmPassword' | translate">

        <button id="register-button" type="submit">{{ 'register.registerButton' | translate }}</button>
</form>
</div>
<app-footer></app-footer>
